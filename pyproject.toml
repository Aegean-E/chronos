[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos-cli"
version = "0.1.0"
description = "A lightweight developer focus and session orchestrator"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Assistant" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
chronos = "chronos.cli:main"
