[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos-cli"
version = "0.2.0"
description = "A lightweight developer focus and session orchestrator"
readme = "README.md"
license = "LicenseRef-AL-1.1"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Aegean-E", email = "aegean-licensing@proton.me" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
chronos = "chronos.cli:main"
